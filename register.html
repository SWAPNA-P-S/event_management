<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration - Event Hub</title>

    <link
        rel="stylesheet"
        href="CSS/user_register.css"
    >

</head>


<body>

    <div class="page">

        <main class="container">

            <h1>
                Create Account
            </h1>

            <p class="subtitle">
                Create your account to access the College Event Management System.
            </p>


            <div class="registration-card">

                <h2>
                    Account Details
                </h2>


                <form
                    action="register.php"
                    method="POST"
                >


                    <!-- =====================================
                         REGISTER AS
                    ====================================== -->

                    <label for="role">
                        Register As
                    </label>


                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Select your role
                        </option>


                        <option value="student">
                            Student
                        </option>


                        <option value="organizer">
                            Organizer
                        </option>


                        <option value="stage_manager">
                            Stage Manager
                        </option>


                        <option value="admin">
                            Admin
                        </option>


                        <option value="core_admin">
                            Core Admin
                        </option>

                    </select>


                    <br>


                    <!-- =====================================
                         FULL NAME
                    ====================================== -->

                    <label for="name">
                        Full Name
                    </label>


                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <!-- =====================================
                         EMAIL
                    ====================================== -->

                    <label for="email">
                        Email
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >


                    <!-- =====================================
                         PHONE
                    ====================================== -->

                    <label for="phone">
                        Phone Number
                    </label>


                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >


                    <!-- =====================================
                         COLLEGE
                    ====================================== -->

                    <label for="college">
                        College / Institution
                    </label>


                    <input
                        type="text"
                        id="college"
                        name="college"
                        placeholder="Enter your college name"
                        required
                    >


                    <!-- =====================================
                         DEPARTMENT
                    ====================================== -->

                    <label for="department">
                        Department
                    </label>


                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="Enter your department"
                        required
                    >


                    <!-- =====================================
                         REGISTRATION NUMBER
                    ====================================== -->

                    <label for="registration_number">
                        Registration Number
                    </label>


                    <input
                        type="text"
                        id="registration_number"
                        name="registration_number"
                        placeholder="Enter your registration number"
                        required
                    >


                    <!-- =====================================
                         PASSWORD
                    ====================================== -->

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >


                    <!-- =====================================
                         CONFIRM PASSWORD
                    ====================================== -->

                    <label for="confirm_password">
                        Confirm Password
                    </label>


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        required
                    >


                    <!-- =====================================
                         SUBMIT
                    ====================================== -->

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Create Account
                    </button>


                </form>


                <p class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


            </div>

        </main>

    </div>

</body>

</html>
